# LeadSmart Coverage Tool — deployment config
#
# The page shell (index.html) and a snapshot of the data are in this repo,
# but all data requests are proxied LIVE to the upstream site, which itself
# syncs several times a day from LeadSmart's affiliate bid feed
# (affiliate-bid-coverage.leadsmartinc.com) and adds city population metrics.
# Result: this deployment always shows the current dataset, with no
# scheduled re-upload needed. If the proxy lines below are removed, the
# site falls back to the snapshot data files stored in this repo under /api/.
#
# force = true is required: without it, Netlify serves the local snapshot
# files in preference to these proxy rules.

[[redirects]]
  from = "/api/*"
  to = "https://leadsmart-coverage.netlify.app/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/data.js"
  to = "https://leadsmart-coverage.netlify.app/data.js"
  status = 200
  force = true
